# Logstash: unico escritor hacia Elasticsearch.
#
# Extension del pipeline del Taller 2. Se conservan sus cuatro tipos de input
# (file, http, tcp, http_poller) y se les suman tres de Kafka. Cada evento trae
# el campo `tipo_fuente`, que cumple el mismo papel que el `type` del taller:
# decide el filtro condicional y el indice destino.
#
# Ver contratos/CONTRATO_DATOS.md, secciones 1 y 6.bis.

input {

  # -------------------------------------------------------------------------
  # NEAR REAL-TIME - Kafka
  # -------------------------------------------------------------------------
  # Tres consumidores distintos, con group_id distinto cada uno. Compartir
  # group_id entre topics hace que Kafka reparta las particiones entre ellos y
  # cada consumidor reciba solo una parte de lo que le corresponde.
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["trades.crudo"]
    codec => "json"
    client_id => "logstash-trades"
    group_id => "logstash-cripto-trades"
    auto_offset_reset => "latest"
  }

  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["metricas.1min"]
    codec => "json"
    client_id => "logstash-metricas"
    group_id => "logstash-cripto-metricas"
    auto_offset_reset => "earliest"
  }

  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["alertas.precio"]
    codec => "json"
    client_id => "logstash-alertas"
    group_id => "logstash-cripto-alertas"
    auto_offset_reset => "earliest"
  }

  # -------------------------------------------------------------------------
  # BATCH - archivo NDJSON que deja el DAG 04
  # -------------------------------------------------------------------------
  # ES EL PUNTO DONDE LOS DOS CAMINOS SE TOCAN. Sin este input, todo el camino
  # batch se queda en MySQL y nunca llega a Kibana.
  #
  # El DAG 04 escribe un archivo NUEVO por lote, nunca sobrescribe el mismo:
  # `sincedb` recuerda hasta donde leyo cada archivo, y un archivo que encoge y
  # crece produce un comportamiento impredecible.
  #
  # `mode => "tail"` con `start_position => "beginning"`: los archivos nuevos se
  # leen enteros desde el principio.
  # CODEC `json`, NO `json_lines`. Es la trampa de este input.
  #
  # El input `file` ya trocea el archivo por saltos de linea y entrega cada
  # linea SIN el salto final. Si encima se le pone `json_lines`, ese codec
  # vuelve a buscar un delimitador que ya no esta, se queda con la linea en el
  # bufer esperandolo, y no emite NUNCA. El sintoma es el peor posible: Logstash
  # arranca sin ningun error, el archivo se detecta, y no aparece un solo
  # documento en Elasticsearch.
  #
  # `json_lines` solo tiene sentido donde el flujo si trae los saltos de linea,
  # como en el input tcp de mas abajo.
  file {
    path => "/datos/exportado/*/*.ndjson"
    codec => "json"
    mode => "tail"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_batch"
    # El DAG escribe el archivo de una vez; 1 segundo basta para detectarlo.
    discover_interval => 1
  }

  # -------------------------------------------------------------------------
  # OPERACION - los inputs que ya existian en el Taller 2
  # -------------------------------------------------------------------------
  # Hacen que el pipeline se observe a si mismo. Los DAGs ya publican aqui
  # mediante comun/observabilidad.py: hitos por HTTP, logs por TCP.
  http {
    port => 8088
    codec => "json"
  }

  tcp {
    port => 5000
    codec => "json_lines"
  }
}

filter {

  # -------------------------------------------------------------------------
  # Sello de indexacion
  # -------------------------------------------------------------------------
  # La hora a la que Logstash toca el evento. Es el unico modo de medir el
  # tramo Kafka -> Logstash -> Elasticsearch: `@timestamp` NO sirve, porque se
  # deriva de `ts_evento` unas lineas mas abajo y la resta daria cero siempre,
  # con cualquier volumen y en cualquier maquina.
  #
  # Esa resta contra si misma es justo lo que hacia la primera version de
  # `prueba_latencia.py`, que reportaba 0,00 ms en los tres percentiles y
  # parecia un resultado excelente.
  #
  # Va antes del bloque `date` a proposito: cuanto mas cerca de la entrada, mas
  # fielmente mide el paso por el pipeline y no el trabajo de los filtros.
  ruby {
    code => "event.set('ts_indexado', Time.now.utc.strftime('%Y-%m-%dT%H:%M:%S.%LZ'))"
  }

  # -------------------------------------------------------------------------
  # Marca temporal
  # -------------------------------------------------------------------------
  # Cada tipo de fuente trae su tiempo en un campo distinto. `@timestamp` se
  # deriva de el, NO se envia desde el origen: si cada productor pusiera su
  # propio @timestamp, un reloj desajustado desalinearia toda la vista comun.
  if [tipo_fuente] == "nrt_trade" {
    date { match => ["ts_evento", "ISO8601"] target => "@timestamp" }

  } else if [tipo_fuente] == "nrt_metrica" {
    # La ventana se ancla a su INICIO. Anclarla al fin desplazaria toda la serie
    # un minuto respecto de los trades que la componen.
    date { match => ["ventana_inicio", "ISO8601"] target => "@timestamp" }

  } else if [tipo_fuente] == "nrt_alerta" {
    date { match => ["ts_generada", "ISO8601"] target => "@timestamp" }

  } else if [tipo_fuente] in ["batch_ohlcv", "batch_conciliacion"] {
    date { match => ["fecha_hora", "ISO8601"] target => "@timestamp" }

  } else if [tipo_fuente] in ["ops_control", "ops_log"] {
    date { match => ["ts", "ISO8601"] target => "@timestamp" }

  } else {
    # Un evento sin tipo_fuente reconocido no se descarta: se marca. Descartarlo
    # lo haria invisible y el sintoma seria "faltan datos" sin ninguna pista.
    mutate { add_field => { "tipo_fuente" => "desconocido" } }
    mutate { add_tag => ["sin_tipo_fuente"] }
  }

  # -------------------------------------------------------------------------
  # Limpieza
  # -------------------------------------------------------------------------
  # Metadatos que agrega Logstash y no aportan nada al analisis. `path` y `host`
  # solo tienen sentido para el input file y el tcp respectivamente.
  mutate {
    remove_field => ["@version", "event", "log", "path"]
  }
}

output {

  # ---------------------------------------------------------------------------
  # BATCH: un indice por tipo, SIN fecha, y con _id derivado de la clave natural
  # ---------------------------------------------------------------------------
  # DOS DECISIONES QUE SE TOMARON EJECUTANDO, NO DISENANDO.
  #
  # 1. Sin fecha en el nombre. El sufijo %{+YYYY.MM.dd} se calcula sobre
  #    @timestamp, y para una vela @timestamp es SU fecha, de hace hasta un ano,
  #    no la de ingesta. La primera carga real creo mas de 300 indices, uno por
  #    cada dia de la serie, con tres documentos cada uno. La convencion con
  #    fecha sirve para un flujo continuo, donde todo cae en el dia actual; para
  #    una carga historica es una fragmentacion absurda.
  #
  # 2. `document_id` derivado de la clave natural. Sin el, Elasticsearch asigna
  #    un id aleatorio y CADA corrida del DAG anade otros 1092 documentos. El
  #    camino batch es idempotente en MySQL —ON DUPLICATE KEY UPDATE sobre
  #    (id_activo, fecha)— y tiene que serlo tambien aqui, o a la tercera
  #    corrida los paneles mostrarian el triple de volumen sin ningun error.
  #    Es la misma clave natural, aplicada al otro almacen.
  if [tipo_fuente] == "batch_ohlcv" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cripto-batch_ohlcv"
      document_id => "%{[id_activo]}_%{[fecha]}"
      manage_template => false
    }

  } else if [tipo_fuente] == "batch_conciliacion" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cripto-batch_conciliacion"
      document_id => "%{[simbolo]}_%{[fecha_hora]}"
      manage_template => false
    }

  # ---------------------------------------------------------------------------
  # NRT Y OPERACION: indice diario, como en el Taller 2
  # ---------------------------------------------------------------------------
  # Aqui la convencion con fecha SI tiene sentido: son flujos continuos, su
  # @timestamp es siempre proximo al momento actual, y un indice por dia permite
  # borrar historia antigua eliminando indices enteros en vez de documentos.
  #
  # Sin `document_id`: cada trade y cada ventana son eventos distintos, no
  # actualizaciones de un mismo hecho.
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cripto-%{[tipo_fuente]}-%{+YYYY.MM.dd}"
      # La plantilla se aplica aparte (servicio elasticsearch-init): gestionarla
      # desde Logstash mezclaria enrutamiento con modelado.
      manage_template => false
    }
  }

  # Consola solo para los eventos marcados como problematicos. Imprimir TODO
  # con rubydebug hace inviable la prueba de carga: cada evento se serializa y
  # se escribe a stdout.
  if "sin_tipo_fuente" in [tags] {
    stdout { codec => rubydebug }
  }
}
